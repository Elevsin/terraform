---
name: Terraform validate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------------
  # 1. Читаем версии инструментов из .tool-versions и ищем директории
  #    с *.tf.
  # ---------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terraform_version: ${{ steps.versions.outputs.terraform }}
      dirs: ${{ steps.find.outputs.dirs }}
      has_dirs: ${{ steps.find.outputs.has_dirs }}
      has_vagrantfile: ${{ steps.find.outputs.has_vagrantfile }}
      has_modules: ${{ steps.find.outputs.has_modules }}
    steps:
      - uses: actions/checkout@v7

      - id: versions
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .tool-versions ]; then
            echo "::error::В корне репозитория нет .tool-versions"
            exit 1
          fi

          tf=$(awk '$1=="terraform"{print $2}' .tool-versions)
          if [ -z "$tf" ]; then
            echo "::error::В .tool-versions нет строки 'terraform <версия>'"
            exit 1
          fi

          echo "terraform=${tf}" >> "$GITHUB_OUTPUT"
          echo "Terraform: ${tf}"

      - id: find
        shell: bash
        run: |
          set -euo pipefail

          dirs=$(find . -type f -name '*.tf' \
                   -not -path './.git/*' \
                   -not -path '*/.terraform/*' \
                 -exec dirname {} \; | sort -u | sed 's|^\./||')

          if [ -z "$dirs" ]; then
            echo "has_dirs=false" >> "$GITHUB_OUTPUT"
            echo "dirs=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_dirs=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$(printf '%s\n' "$dirs" | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          fi

          if find . -name 'Vagrantfile*' -not -path './.git/*' | grep -q .; then
            echo "has_vagrantfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vagrantfile=false" >> "$GITHUB_OUTPUT"
          fi

          if find ./modules -name '*.tf' 2>/dev/null | grep -q .; then
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Найденные директории:"
          printf '%s\n' "$dirs"

  # ---------------------------------------------------------------------
  # 2. Форматирование
  # ---------------------------------------------------------------------
  fmt:
    name: terraform fmt
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  # ---------------------------------------------------------------------
  # 3. init -backend=false + validate по каждой директории отдельно.
  # ---------------------------------------------------------------------
  validate:
    name: validate (${{ matrix.dir }})
    needs: setup
    if: needs.setup.outputs.has_dirs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.setup.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -no-color

      - name: terraform validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------
  # 4. TFLint
  #    Провайдерного ruleset для vagrant нет — работает core-ruleset.
  #
  #    Прогонов два, потому что исключить директорию в конфиге tflint
  #    нельзя. terraform_standard_module_structure — соглашение для
  #    переиспользуемых модулей; корневые модули в environments/
  #    параметризуются через locals, блоков variable у них нет и
  #    variables.tf им не нужен.
  # ---------------------------------------------------------------------
  tflint:
    name: tflint
    needs: setup
    if: needs.setup.outputs.has_dirs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version_file: .tool-versions

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Прогоны привязаны к modules/ и environments/. Если .tf появится
      # где-то ещё, он выпадет из линтинга — здесь это ловится явно.
      - name: Проверить, что все .tf-директории покрыты линтом
        shell: bash
        env:
          DIRS: ${{ needs.setup.outputs.dirs }}
        run: |
          set -euo pipefail
          uncovered=$(printf '%s' "$DIRS" | jq -r '.[]
            | select((. == "modules" or . == "environments"
                      or startswith("modules/")
                      or startswith("environments/")) | not)')
          if [ -n "$uncovered" ]; then
            echo "::error::Директории с *.tf вне modules/ и environments/ не линтуются:"
            printf '%s\n' "$uncovered"
            echo "Добавьте их в джобу tflint или перенесите в существующее дерево."
            exit 1
          fi
          echo "Все .tf-директории покрыты."

      - name: tflint
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          cfg="$GITHUB_WORKSPACE/.tflint.hcl"

          if [ -d modules ]; then
            echo "::group::modules"
            (cd modules && tflint --recursive --format=compact --config "$cfg") || rc=1
            echo "::endgroup::"
          fi

          if [ -d environments ]; then
            echo "::group::environments"
            (cd environments && tflint --recursive --format=compact --config "$cfg" \
               --disable-rule=terraform_standard_module_structure) || rc=1
            echo "::endgroup::"
          fi

          exit $rc

  # ---------------------------------------------------------------------
  # 5. Синтаксис Vagrantfile.
  # ---------------------------------------------------------------------
  vagrant-lint:
    name: Vagrantfile lint
    needs: setup
    if: needs.setup.outputs.has_vagrantfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Ruby syntax check (Vagrantfile)
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            echo "::group::$f"
            ruby -c "$f" || rc=1
            echo "::endgroup::"
          done < <(find . -name 'Vagrantfile*' -not -path './.git/*')
          exit $rc

  # ---------------------------------------------------------------------
  # 6. Проверка, что README модулей соответствует их переменным.
  # ---------------------------------------------------------------------
  docs:
    name: terraform-docs
    needs: setup
    if: needs.setup.outputs.has_modules == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-docs/gh-actions@v1
        with:
          find-dir: modules
          output-file: README.md
          output-method: inject
          fail-on-diff: true
          config-file: .terraform-docs.yml

  # ---------------------------------------------------------------------
  # 7. Секреты в коде и корректность самих воркфлоу.
  #
  #    gitleaks вызывается бинарником, а не через gitleaks-action: нужны
  #    два прогона с разной строгостью, а action такого не умеет. Заодно
  #    отпадает лицензия, обязательная для организаций.
  #
  #    Строгий прогон читает gitleaks.toml, где пароли стенда в
  #    environments/*/config.tf вынесены в allowlist по двум правилам.
  #    Мягкий прогон работает по дефолтным правилам и только сообщает,
  #    какие пароли затронуты в этом изменении.
  # ---------------------------------------------------------------------
  hygiene:
    name: gitleaks & actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.3"
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # gitleaks смотрит историю

      - name: Установить gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Определить диапазон коммитов
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          NULL_SHA=0000000000000000000000000000000000000000
          range=""
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ "$BEFORE" != "$NULL_SHA" ]; then range="${BEFORE}..${AFTER}"; fi
              ;;
          esac
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "Диапазон: ${range:-вся история}"

      - name: gitleaks (строгий)
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          opts=()
          [ -n "$RANGE" ] && opts=(--log-opts="$RANGE")
          ./gitleaks git . --no-banner --redact -c gitleaks.toml "${opts[@]}"

      - name: gitleaks (пароли стенда — только предупреждение)
        if: always()
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          opts=()
          [ -n "$RANGE" ] && opts=(--log-opts="$RANGE")
          ./gitleaks git . --no-banner --redact --exit-code 0 \
            -f json -r soft.json "${opts[@]}" > /dev/null

          python3 - <<'PY'
          import json
          PW_RULES = {"hashicorp-tf-password", "generic-api-key"}
          try:
              findings = json.load(open("soft.json"))
          except Exception:
              findings = []
          hits = [f for f in findings
                  if f["RuleID"] in PW_RULES
                  and f["File"].startswith("environments/")
                  and f["File"].endswith("config.tf")]
          if not hits:
              print("Пароли стенда в этом изменении не затронуты.")
          else:
              print(f"::warning::Затронуто паролей стенда: {len(hits)}. "
                    "Для локального стенда это допустимо — убедитесь, "
                    "что значение не используется нигде за его пределами.")
              for f in sorted(hits, key=lambda x: (x["File"], x["StartLine"])):
                  print(f'  {f["File"]}:{f["StartLine"]}  ({f["RuleID"]})')
          PY

      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  # ---------------------------------------------------------------------
  # 8. Один статус-чек для branch protection.
  # ---------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [setup, fmt, validate, tflint, vagrant-lint, docs, hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          SETUP_RESULT: ${{ needs.setup.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          if [ "$SETUP_RESULT" != "success" ]; then
            echo "::error::setup завершился со статусом '${SETUP_RESULT}' — остальные проверки недостоверны"
            exit 1
          fi

          # skipped остаётся допустимым: его дают условные джобы
          # vagrant-lint, docs и validate через свои if.
          if echo "$RESULTS" | jq -e 'to_entries
               | map(select(.value.result == "failure" or .value.result == "cancelled"))
               | length > 0' > /dev/null; then
            echo "::error::Есть упавшие джобы"
            exit 1
          fi
          echo "Все проверки прошли"